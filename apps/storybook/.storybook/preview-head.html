<!-- Inter font — loaded here so all Storybook preview iframes have access.
     'Inter var' (variable font) is preferred; static Inter is the fallback.
     Both are referenced in --ep-semantic-typography-font-family. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
  rel="stylesheet"
/>

<style>
  /*
   * Apply the design-system font stack globally in the Storybook preview iframe.
   * This ensures components that rely on font-family inheritance (e.g. Typography)
   * render correctly without requiring every component to set fontFamily explicitly.
   * The CSS custom property is defined by @eventpipe/tokens/css (imported in preview.tsx).
   * The fallback stack covers environments where tokens haven't loaded yet.
   */
  body,
  #storybook-root {
    font-family: var(
      --ep-semantic-typography-font-family,
      'Inter var', Inter, ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif
    );
  }
</style>
